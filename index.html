<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1326">
<meta name="description" content="마감이 다가올수록 HP가 줄어드는 대학생용 과제 타이머. 시작 마지노선과 과제 작성 가이드를 알려 줘요.">
<title>과제 타이머</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#dashboard" aria-label="과제 타이머 대시보드">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="24" height="14" rx="3" fill="none" stroke="#31394d" stroke-width="2"/><rect x="27" y="13" width="3" height="6" rx="1" fill="#31394d"/><rect x="6" y="12" width="5" height="8" rx="1" fill="#ef4444"/><rect x="12.5" y="12" width="5" height="8" rx="1" fill="#f59e0b" opacity=".85"/><rect x="19" y="12" width="5" height="8" rx="1" fill="#10b981" opacity=".35"/></svg>
      과제 타이머
    </a>
    <nav class="nav" aria-label="주요 화면">
      <a href="#dashboard" data-nav="dashboard">대시보드</a>
      <a href="#archive" data-nav="archive">아카이브</a>
      <a href="#settings" data-nav="settings">설정</a>
    </nav>
    <div class="hud">
      <span class="clock" id="clock"></span>
      <span class="urgent" id="urgent" role="status"></span>
      <button class="btn primary new" id="newBtn" type="button">+ 새 과제</button>
    </div>
  </div>
</header>
<div id="banners"></div>
<main id="view"></main>
<button class="fab" id="fab" type="button" aria-label="새 과제 추가">+ 새 과제</button>

<div class="sheet" id="sheet" hidden>
  <form class="sheet-box" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 id="sheetTitle">새 과제 등록</h2>
      <button class="btn ghost sm" type="button" data-close>닫기</button>
    </div>
    <div id="sheetFields"></div>
  </form>
</div>

<div class="toast" id="toast" hidden role="status">
  <div class="in"><span id="toastText"></span><button class="btn sm guide" type="button" id="undoBtn">되돌리기</button></div>
  <div class="prog" id="toastProg"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
