<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과제 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a tactical HUD for a stressed student — calm navy, signals only where time is short.
   IDEA: every assignment is a unit with a health bar; the deadline drains it.
   PICTURE: segmented game HP bars and the "start now" emergency box, at the top of the first screen.
   COLOUR and TYPE: DESIGN.md tokens — navy #0b1326 ground, emerald/amber/crimson HP signals, cyan for AI; Plus Jakarta Sans + Noto Sans KR, JetBrains Mono for counters.
   LAYOUT: header HUD, emergency box, quick add, task list; workspace = HUD strip, sources left, guide right; archive = survival dial, clear list, game over. */
:root{color-scheme:dark;
--bg:#0b1326;--dim:#060e20;--low:#131b2e;--cont:#1a233a;--bright:#31394d;
--ink:#e6ebf5;--sub:#a9b4c9;--mute:#8592aa;
--safe:#10b981;--warn:#f59e0b;--crit:#ef4444;--over:#64748b;--clear:#34d399;--ai:#06b6d4;
--glow-crit:0 0 15px rgba(239,68,68,.25);--glow-safe:0 0 12px rgba(16,185,129,.3);--shadow:0 4px 20px -2px rgba(0,0,0,.4);
--sans:"Plus Jakarta Sans","Noto Sans KR",-apple-system,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
a{color:var(--ai)}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(26px,3.4vw,32px);font-weight:700;line-height:1.2}
h2{font-size:clamp(19px,2.2vw,22px);font-weight:600}
h3{font-size:17px;font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(20px,3vw,40px) max(4vw,16px)}
.muted{color:var(--sub)}
.small{font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--bright);background:var(--cont);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#4a556f}
.btn.primary{background:var(--safe);border-color:var(--safe);color:#04241a}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.ai{background:rgba(6,182,212,.12);border-color:rgba(6,182,212,.5);color:#7ee6f5}
.btn.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.45);color:#fca5a5}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border:1px solid var(--bright);background:var(--cont);font-size:16px}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ai);box-shadow:0 0 0 3px rgba(6,182,212,.18)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub);font-weight:500}
.err{color:#fca5a5;font-size:12.5px;min-height:18px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--bright);background:var(--low);color:var(--sub);white-space:nowrap}

/* header HUD */
.top{position:sticky;top:0;z-index:20;background:rgba(6,14,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bright)}
.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:12px max(4vw,16px)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:800;font-size:18px}
.nav{display:flex;gap:4px}
.nav a{padding:10px 12px;border-radius:8px;color:var(--sub);text-decoration:none;font-weight:600}
.nav a[aria-current=page]{background:var(--cont);color:var(--ink)}
.hud{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--mono);color:var(--sub);font-size:13px}
.urgent{font-family:var(--mono);font-size:12.5px;padding:6px 10px;border-radius:8px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5}
.urgent.calm{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.35);color:#6ee7b7}
.banner{background:#3a2a0b;color:#fcd34d;text-align:center;padding:10px 16px;font-size:13.5px}

/* emergency */
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{padding:8px 12px;border-radius:8px;background:var(--low);border:1px solid var(--bright);font-size:13px;color:var(--sub)}
.stat b{font-family:var(--mono);color:var(--ink);margin-left:6px}
.emg{border-radius:16px;padding:18px;background:linear-gradient(180deg,rgba(239,68,68,.10),rgba(239,68,68,.03));border:1px solid rgba(239,68,68,.45);box-shadow:var(--glow-crit)}
.emg.calm{background:var(--low);border-color:var(--bright);box-shadow:none}
.emg-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.emg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.emg-item{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;background:var(--dim);border:1px solid rgba(239,68,68,.35);color:var(--ink);text-decoration:none}
.emg-item:hover{border-color:var(--crit)}
.emg-item .why{color:#fca5a5;font-weight:600}
.emg-item .zero{font-family:var(--mono);font-size:12.5px;color:var(--sub)}

/* quick add */
.quick{border-radius:16px;background:var(--low);border:1px solid var(--bright);padding:16px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,.7fr) auto;gap:4px 10px;align-items:start}
.quick .types{grid-column:1/-1;justify-self:start;margin-bottom:10px}
.quick .sub{margin-top:25px}
.types{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:var(--dim);border:1px solid var(--bright);flex-wrap:wrap}
.types button{min-height:36px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:var(--sub);font-weight:600;cursor:pointer;font-size:13px}
.types button[aria-pressed=true]{background:var(--cont);color:var(--ink);box-shadow:inset 0 0 0 1px var(--t)}
.amt{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:6px}
.calc{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.calc b{font-family:var(--mono);color:var(--ai);font-size:15px}
.ok{color:#6ee7b7}

/* task cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:var(--low);border:1px solid var(--bright);box-shadow:var(--shadow)}
.card.crit{border-color:rgba(239,68,68,.55)}
.card.pulse{animation:pulse 1.5s ease-in-out infinite}
.card.shake{animation:pulse 1.5s ease-in-out infinite,shake .45s linear infinite}
.card.shake:hover,.card.shake:focus-within{animation:pulse 1.5s ease-in-out infinite}
.card.over{background:#121827;filter:saturate(.3)}
.card.over h3{color:var(--sub)}
@keyframes pulse{50%{box-shadow:var(--glow-crit),0 0 0 1px var(--crit)}}
@keyframes shake{20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.c-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;color:var(--t);border:1px solid var(--t)}
.badge{padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-crit{background:rgba(239,68,68,.15);color:#fca5a5}
.b-warn{background:rgba(245,158,11,.15);color:#fcd34d}
.b-over{background:rgba(100,116,139,.25);color:#cbd5e1}
.b-sample{background:var(--cont);color:var(--mute);font-family:var(--sans)}
.c-time{font-family:var(--mono);font-size:13px;color:var(--sub)}
.hp{display:grid;grid-template-columns:auto minmax(0,1fr) 52px;gap:10px;align-items:center}
.hp .lbl{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--mute)}
.bar{height:14px;background:#0a1020;border-radius:3px;position:relative;overflow:hidden;
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .5s}
.hp .pct{font-family:var(--mono);font-weight:700;text-align:right;color:var(--c)}
.c-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--sub)}
.c-meta b{color:var(--ink);font-weight:600}
.c-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.c-act .btn{flex:1 1 auto}
.empty{border:1px dashed var(--bright);border-radius:14px;padding:40px 20px;text-align:center;color:var(--sub)}
.note{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.3);margin-bottom:12px;font-size:13.5px}
.legend{display:flex;gap:10px 22px;flex-wrap:wrap;font-size:13px;color:var(--sub);border-top:1px solid var(--bright)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:26px;height:8px;border-radius:2px;background:var(--c)}

/* workspace */
.back{display:inline-flex;gap:6px;align-items:center;color:var(--sub);text-decoration:none;font-weight:600;margin-bottom:12px;min-height:44px}
.ws-hud{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-top:16px;padding:16px;border-radius:16px;background:var(--low);border:1px solid var(--bright)}
.dial{width:112px;height:112px;position:relative}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial b{font-family:var(--mono);font-size:22px}
.dial span{font-size:11px;color:var(--mute)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
.meta div{padding:10px 12px;border-radius:10px;background:var(--dim)}
.meta dt{font-size:12px;color:var(--mute)}
.meta dd{margin:2px 0 0;font-family:var(--mono);font-weight:700;font-size:15px}
.ws{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.panel{border-radius:16px;background:var(--low);border:1px solid var(--bright);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:18px}
.issue-in{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:15px;line-height:1;padding:0 0 0 2px;min-width:24px;min-height:24px}
.drop{display:block;padding:18px;border-radius:12px;border:1.5px dashed var(--bright);background:var(--dim);text-align:center;color:var(--sub);cursor:pointer}
.drop.on{border-color:var(--ai);color:var(--ink)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.file{padding:12px;border-radius:10px;background:var(--dim);border:1px solid var(--bright);display:flex;flex-direction:column;gap:8px}
.file-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.file-h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kw{display:flex;flex-wrap:wrap;gap:4px}
.kw span{font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(6,182,212,.1);color:#7ee6f5}
.req{margin:0;padding-left:18px;font-size:13px;color:var(--sub)}
.sum{white-space:pre-wrap;font-size:13px;color:var(--sub);line-height:1.6}
.tip{padding:10px 12px;border-radius:10px;background:var(--dim)}
.tip b{display:block;font-size:13.5px}
.tip span{font-size:13px;color:var(--sub)}
.g-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.g-badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--cont);color:var(--sub)}
.g-badge.ai{background:rgba(6,182,212,.15);color:#7ee6f5}
.status{font-size:13px;color:var(--sub);margin:0}
.status.e{color:#fca5a5}.status.w{color:#fcd34d}
.need{padding:14px;border-radius:12px;background:rgba(6,182,212,.07);border:1px solid rgba(6,182,212,.3);font-size:14.5px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{white-space:nowrap;text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--bright)}
td{padding:10px;border-bottom:1px solid var(--bright);vertical-align:top;line-height:1.55}
td ul{margin:0;padding-left:16px}
td .src{display:block;font-size:12px;color:var(--mute)}
.alloc td:nth-child(2){font-family:var(--mono);white-space:nowrap;color:var(--ai)}
.abar{height:8px;border-radius:2px;background:var(--ai);opacity:.7;margin-top:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--bright);cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--safe);flex:none}
.check.done span{color:var(--mute);text-decoration:line-through}
.next{padding:14px;border-radius:12px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.35)}
.next b{color:#6ee7b7;display:block;font-size:12.5px;margin-bottom:2px}

/* archive */
.arc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding:18px;border-radius:16px;background:var(--low);border:1px solid var(--bright);margin-top:16px}
.donut{width:150px;height:150px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut b{font-family:var(--mono);font-size:28px;color:var(--clear)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--low);border:1px solid var(--bright)}
.row+.row{margin-top:8px}
.row .when{font-family:var(--mono);font-size:12.5px;color:var(--sub)}
.row.sel{border-color:rgba(52,211,153,.6)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* sheet + toast */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(6,14,32,.75);padding:16px}
.sheet[hidden]{display:none}
.sheet-box{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:16px;background:var(--low);border:1px solid var(--bright);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;width:min(460px,calc(100% - 32px));border-radius:16px;background:var(--cont);border:1px solid var(--bright);box-shadow:var(--shadow);overflow:hidden}
.toast[hidden]{display:none}
.toast .in{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 10px 10px 16px}
.toast .prog{height:3px;background:var(--ai);transform-origin:left;animation:drain 8s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}

@media (max-width:980px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quick .sub{grid-column:1/-1;margin-top:4px}.ws{grid-template-columns:minmax(0,1fr)}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){
 .emg-grid{grid-template-columns:minmax(0,1fr)}
 .quick{grid-template-columns:minmax(0,1fr)}
 .hud{margin-left:0;width:100%}
 .top .btn.primary{flex:1 1 100%}
 .clock{display:none}
 .quick .types{justify-self:stretch}.quick .types button{flex:1}
 .ws-hud,.arc{grid-template-columns:minmax(0,1fr);justify-items:center}
 .meta{width:100%}
 .sheet{align-items:flex-end;padding:0}
 .sheet-box{border-radius:16px 16px 0 0;max-height:92vh;width:100%}
 .form-grid{grid-template-columns:minmax(0,1fr)}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--bright)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:6.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6em;margin-inline-start:-6.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#dashboard" aria-label="과제 타이머 대시보드">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="24" height="14" rx="3" fill="none" stroke="#31394d" stroke-width="2"/><rect x="27" y="13" width="3" height="6" rx="1" fill="#31394d"/><rect x="6" y="12" width="5" height="8" rx="1" fill="#ef4444"/><rect x="12.5" y="12" width="5" height="8" rx="1" fill="#f59e0b" opacity=".85"/><rect x="19" y="12" width="5" height="8" rx="1" fill="#10b981" opacity=".35"/></svg>
      과제 타이머
    </a>
    <nav class="nav" aria-label="주요 화면">
      <a href="#dashboard" data-nav="dashboard">대시보드</a>
      <a href="#archive" data-nav="archive">아카이브</a>
    </nav>
    <div class="hud">
      <span class="clock" id="clock" aria-label="현재 시각"></span>
      <span class="urgent" id="urgent"></span>
      <button class="btn primary" id="newBtn" type="button">+ 새 과제 추가</button>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden>이 창에서는 저장이 안 돼요. 새로고침하면 과제가 사라져요.</div>
<main id="view"></main>

<div class="sheet" id="sheet" hidden>
  <form class="sheet-box" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h2 id="sheetTitle">새 과제 등록</h2>
      <button class="btn ghost sm" type="button" data-close aria-label="닫기">닫기</button>
    </div>
    <div id="sheetFields"></div>
  </form>
</div>

<div class="toast" id="toast" hidden role="status">
  <div class="in"><span id="toastText"></span><button class="btn sm ai" type="button" id="undoBtn">되돌리기</button></div>
  <div class="prog" id="toastProg"></div>
</div>

<script>
{
/* ---------- tested logic carried over from the first prototype ---------- */
const L = {
  toLocalInput(ts) {
    var d = new Date(ts), pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  },
  analyzeText(text) {
  var clean = String(text || '').replace(/\r/g, '').replace(/https?:\/\/\S+|www\.\S+/g, ' ').replace(/[ \t ]+/g, ' ');
  var lines = clean.split('\n').map(function (l) { return l.trim(); });

  async unzip(file, want) {

function load() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S.blocked = true; }

}

  try { localStorage.setItem(KEY, JSON.stringify(S.tasks)); } catch (e) { S.blocked = true; $('#banner').hidden = false; }
}

/* ---------- derived ---------- */
function status(t) {
  const left = t.due - S.now, nm = need(t);
  const hp = Math.max(0, Math.min(100, Math.round(left / WEEK * 100)));
  const over = !t.done && left <= 0;
  const c = over ? 'var(--over)' : hp > 50 ? 'var(--safe)' : hp >= 20 ? 'var(--warn)' : 'var(--crit)';
  const level = over ? 'over' : left <= 6 * H ? 'shake' : left <= 24 * H ? 'pulse' : '';
  const slack = nm ? left - nm * 60000 : null;
  return { left, nm, hp, over, c, level, slack, short: nm && !over && slack < 0, zero: nm ? t.due - nm * 60000 : null };
}
function emergency() {
  const out = [];
  S.tasks.filter(t => !t.done).forEach(t => {
    const st = status(t);
    if (st.over) return;
    if (st.nm && st.slack <= 3 * H) out.push({ t, k: st.slack, why: st.slack < 0 ? '지금 시작해도 ' + L.fmtNeed(Math.ceil(-st.slack / 60000)) + ' 모자라요' : L.fmtNeed(Math.max(1, Math.floor(st.slack / 60000))) + ' 안에 시작해야 해요' });
    else if (!st.nm && st.left <= 24 * H) out.push({ t, k: st.left, why: '마감까지 ' + L.fmtNeed(Math.floor(st.left / 60000)) + ' 남았어요' });
  });
  return out.sort((a, b) => a.k - b.k).slice(0, 3);
}

/* ---------- render + routing ---------- */
function route() {
  const h = location.hash.slice(1);
  if (/^guide-\d+$/.test(h) && byId(Number(h.slice(6)))) return { v: 'guide', id: Number(h.slice(6)) };
  return { v: h === 'archive' ? 'archive' : 'dashboard' };
}
function render() {
  S.now = Date.now();
  const r = route();
  document.querySelectorAll('[data-nav]').forEach(a => a.setAttribute('aria-current', a.dataset.nav === r.v ? 'page' : 'false'));
  const act = S.tasks.filter(t => !t.done && !status(t).over);
  const urgentN = act.filter(t => status(t).left <= 24 * H).length;
  const nearest = act.sort((a, b) => a.due - b.due)[0];
  const u = $('#urgent');
  u.className = 'urgent' + (urgentN ? '' : ' calm');
  u.textContent = urgentN ? '24시간 안 마감 ' + urgentN + '개' : nearest ? '다음 마감 D-' + Math.floor((nearest.due - S.now) / 86400000) : '마감 없음';
  if (r.v === 'guide') {
    const t = byId(r.id);
    if (S.viewKey !== 'guide-' + r.id) { $('#view').innerHTML = viewGuide(t); S.viewKey = 'guide-' + r.id; }
    renderHud(t); renderSources(t); renderGuidePanel(t);
  } else {
    S.viewKey = r.v;
    $('#view').innerHTML = r.v === 'archive' ? viewArchive() : viewDashboard();
    if (r.v === 'dashboard') calc('q');
  }
}

  if (!f.due || isNaN(due)) e.due = '마감 날짜와 시간을 선택해 주세요.'; else if (due <= Date.now()) e.due = '이미 지난 시간이에요. 앞으로의 마감일을 골라 주세요.';
  const hasA = f.amount !== '', a = Number(f.amount), per = Number(f.per);
  if (hasA && !(a > 0 && per > 0)) e.amount = '분량과 걸리는 시간을 1 이상의 숫자로 둘 다 입력해 주세요.';
  Object.keys(e).forEach(k => { document.getElementById(p + '-' + k + '-e').textContent = e[k]; });
  const msg = document.getElementById(p + '-msg');
  if (e.name || e.due || e.amount) { msg.className = 'err'; msg.textContent = '빨간 안내가 있는 칸을 확인해 주세요.'; return; }
  const fields = { type, name: f.name, due, amount: hasA ? a : 0, unit: f.unit, per: hasA ? per : 0 };
  if (p === 'm' && S.editing) {
    patch(S.editing, Object.assign(fields, { sample: false }));
    closeSheet();
    toast('\'' + f.name + '\' 과제를 수정했어요.', null);
    return;
  }
  S.tasks = S.tasks.concat([Object.assign({ id: S.nextId++, done: false, created: Date.now() }, fields)]);
  save();
  S.qf = { type, name: '', due: '', amount: '', unit: TYPES[type].unit, per: TYPES[type].per };
  if (p === 'm') closeSheet();
  render();
  const m2 = document.getElementById('q-msg');
  if (m2) { m2.className = 'ok'; m2.textContent = '\'' + f.name + '\' 과제를 추가했어요.'; }
  if (p === 'm') toast('\'' + f.name + '\' 과제를 추가했어요.', null);
}
function openSheet(t) {
  S.editing = t ? t.id : null;
  S.mf = t ? { type: t.type || '기타', name: t.name, due: L.toLocalInput(t.due), amount: t.amount > 0 ? t.amount : '', unit: t.unit || '쪽', per: t.per > 0 ? t.per : (TYPES[t.type] || TYPES['기타']).per } : { type: '보고서', name: '', due: '', amount: '', unit: '쪽', per: 40 };
  $('#sheetTitle').textContent = t ? '과제 수정' : '새 과제 등록';
  $('#sheetFields').innerHTML = '<div class="form-grid">' + formFields('m', S.mf).replace('<div class="types"', '<div class="types full"').replace('class="btn primary sub"', 'class="btn primary sub full"').replace('<div class="calc">', '<div class="calc full">') + '</div>';
  $('#sheet').hidden = false;
  calc('m');
  setTimeout(() => { const n = document.getElementById('m-name'); if (n) n.focus(); }, 30);
}
function closeSheet() { $('#sheet').hidden = true; S.editing = null; $('#newBtn').focus(); }

/* ---------- undo toast ---------- */
let undoTimer = null;
function toast(text, items) {
  clearTimeout(undoTimer);
  S.undo = items;
  $('#toastText').textContent = text;
  $('#undoBtn').hidden = !items;
  const p = $('#toastProg'); p.style.animation = 'none'; void p.offsetWidth; p.style.animation = '';
  $('#toast').hidden = false;
  undoTimer = setTimeout(() => { $('#toast').hidden = true; S.undo = null; }, items ? 8000 : 3000);
}
function removeWithUndo(pred, label) {
  const gone = S.tasks.filter(pred), keep = S.tasks.filter(t => !pred(t));
  if (!gone.length) return;
  S.sel = {};
  setTasks(keep);
  toast(label, gone);
}

/* ---------- files + AI ---------- */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
let pdfReady = null;
function ensurePdf() {
  const b = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  return pdfReady || (pdfReady = loadScript(b + 'pdf.min.js').then(() => loadScript(b + 'pdf.worker.min.js')).then(() => {
    const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
    lib.GlobalWorkerOptions.workerSrc = b + 'pdf.worker.min.js';
    globalThis.pdfjsLib = lib;
    return lib;
  }));
}
async function readFile(t, f) {
  const r = { name: f.name, size: f.size, kind: 'text' };
  const isImg = /^image\/(png|jpeg|webp|gif)$/.test(f.type), isPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
  const isOffice = /\.(docx|pptx|xlsx|hwpx)$/i.test(f.name), isText = /^text\//.test(f.type) || /\.(txt|md|csv)$/i.test(f.name);
  let txt = '';
  try {
    if (isImg) { r.kind = 'image'; blobs[t.id + ':' + f.name + ':' + f.size] = f; return r; }
    if (isPdf) { await ensurePdf(); txt = await L.readPdf(f); if (txt.replace(/\s/g, '').length < 20) { r.kind = 'other'; r.why = 'scan'; return r; } }
    else if (isOffice) txt = await L.readOffice(f);
    else if (isText) txt = await f.text();
    else { r.kind = 'other'; r.why = /\.hwp$/i.test(f.name) ? 'hwp' : 'type'; return r; }
  } catch (e) { r.kind = 'other'; r.why = 'type'; return r; }
  if (txt.replace(/\s/g, '').length < 20) { r.kind = 'other'; return r; }
  r.text = txt.slice(0, 12000);
  try { r.auto = L.analyzeText(txt.slice(0, 60000)); r.auto.sentences = r.auto.sentences.slice(0, 150); } catch (e) {}
  return r;
}
async function addFiles(id, list) {
  const t = byId(id);
  if (!t || !list.length) return;
  S.reading[id] = true; render();
  const res = [];
  for (const f of list) res.push(await readFile(t, f));
  delete S.reading[id];
  const cur = byId(id), start = (cur.files || []).length;
  patch(id, { files: (cur.files || []).concat(res) });
  if (S.sample) {
    for (let i = 0; i < res.length; i++) if (res[i].kind !== 'other') await summarize(id, start + i);
    makeGuide(id);
  }
}
function aiFail(key, e) {
  S.err[key] = e && e.code === 'invalid_json' ? 'AI 답을 정리하지 못했어요. 다시 눌러 주세요.' : L.aiErrorText(e && e.code);
  if (e && /not_granted|sampling_disabled|capability_disabled|not_declared/.test(e.code)) S.sample = null;
}
async function summarize(id, i) {
  const t = byId(id), f = (t.files || [])[i], key = 'sum:' + id + ':' + i;
  if (!f || !S.sample) return;
  const head = '대학생 과제를 돕고 있어요. 아래 참고 자료를 한국어로 요약해 주세요.\n\n' + L.taskContext(t) + '\n\n형식(마크다운 기호 없이 일반 텍스트로):\n핵심 내용: 3~5줄, 줄마다 "- "로 시작\n과제에 쓸 근거: 2개, 줄마다 "- "로 시작\n쟁점과의 연결: 1~2문장\n\n';
  const opts = { modelTier: 'default' };
  let input;
  const blob = blobs[id + ':' + f.name + ':' + f.size];
  if (f.kind === 'image' && blob) { input = head + '자료는 첨부한 이미지("' + f.name + '")예요. 이미지 속 글과 도표를 읽고 요약해 주세요.'; opts.images = [blob]; }
  else if (f.text) input = head + '자료 "' + f.name + '" 내용:\n' + f.text;
  else return;
  S.busy[key] = true; delete S.err[key]; render();
  try {
    const r = await S.sample(input, opts);
    const cur = byId(id);
    if (cur) patch(id, { files: cur.files.map((x, j) => j === i ? Object.assign({}, x, { summary: r.text }) : x) }, true);
  } catch (e) { if (!(e && e.code === 'cancelled')) aiFail(key, e); }
  delete S.busy[key]; render();
}
async function makeGuide(id) {
  const t = byId(id), key = 'guide:' + id;
  if (!t || !S.sample || S.busy[key]) return;
  let budget = 26000;
  const files = (t.files || []).map(f => {
    let part = '■ 자료 "' + f.name + '"\n';
    if (f.summary) part += '요약: ' + f.summary.slice(0, 1200) + '\n'; else if (f.auto) part += '핵심 문장: ' + (f.auto.summary || []).join(' / ') + '\n';
    if (f.text && budget > 0) { const ex = f.text.slice(0, Math.min(6000, budget)); budget -= ex.length; part += '본문 발췌:\n' + ex + '\n'; }
    return part;
  }).join('\n');
  const amountLine = t.amount > 0 ? t.amount + t.unit : '정해지지 않음';
  const prompt = '너는 대학 과제 작성을 지도하는 조교다. 아래 [과제 정보]와 [참고 자료]를 꼼꼼히 읽고, 이 과제에만 해당하는 구체적인 작성 가이드를 만들어라.\n\n규칙\n- 일반론 금지. "근거를 들어라" 같은 말 대신 자료에 나온 개념·수치·사례·용어를 직접 짚어라.\n- 과제를 대신 써 주지 말고, 무엇을 어떤 순서로 어떻게 쓸지 안내하라.\n- 자료에 없는 사실이나 수치를 지어내지 마라. 자료에 없지만 필요한 것은 evidence의 source를 "찾아야 할 자료"로 하고 무엇을 찾을지 적어라.\n- 쟁점이 주어지면 그 쟁점을 그대로 쓰고, 없으면 과제 내용과 자료에서 핵심 쟁점 2~3개를 직접 뽑아라. 쟁점마다 서로 부딪히는 관점(예: 공리주의 대 의무론)을 angles에 드러내라.\n- outline의 amount는 과제 분량(' + amountLine + ')에 맞춰 합이 맞게 나눠라. 분량이 없으면 비율(%)로 적어라.\n- checklist는 감점을 막는 항목 5개.\n- 모든 문장은 한국어 존댓말, 짧고 구체적으로.\n\n오직 아래 형태의 JSON 하나만 답하라:\n{"summary":"과제가 요구하는 것 1~2문장","issues":[{"issue":"쟁점","question":"이 쟁점에서 답해야 할 핵심 질문 1문장","angles":["분석 관점 1문장","분석 관점 1문장"],"evidence":[{"point":"자료 속 근거(짧은 인용이나 요약)","source":"파일 이름 또는 찾아야 할 자료"}],"counter":"예상 반론과 재반박 방향 1~2문장","how":"이 부분을 쓰는 구체적 방법 1~2문장"}],"outline":[{"part":"서론","amount":"1쪽","points":["쓸 내용","쓸 내용"]}],"checklist":["제출 전 확인할 항목"],"next":"지금 바로 할 일 1문장"}\n\n[과제 정보]\n' + L.taskContext(t) + '\n\n[참고 자료]\n' + (files || '(올린 자료 없음)');
  const sig = L.guideSig(t);
  S.busy[key] = true; S.stream[key] = 0; delete S.err[key]; render();
  try {
    const onText = u => { S.stream[key] = u.text.length; if (route().id === id) renderGuidePanel(byId(id)); };
    const raw = typeof S.sample.json === 'function'
      ? await S.sample.json(prompt, { modelTier: 'default', onText })
      : await S.sample(prompt, { modelTier: 'default', onText }).then(r => { const m = r.text.match(/\{[\s\S]*\}/); return JSON.parse(m ? m[0] : r.text); });
    const g = L.normalizeGuide(raw);
    if (g) patch(id, { guide: { data: g, sig, at: Date.now() } }, true); else S.err[key] = 'AI 답을 정리하지 못했어요. 다시 눌러 주세요.';
  } catch (e) { if (!(e && e.code === 'cancelled')) aiFail(key, e); }
  delete S.busy[key]; delete S.stream[key]; render();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act],[data-type],[data-close]');
  if (!b) return;
  if (b.dataset.close !== undefined) { closeSheet(); return; }
  if (b.dataset.type) {
    const form = b.closest('form'), p = form.id === 'quick' ? 'q' : 'm', st = p === 'q' ? S.qf : S.mf, ty = TYPES[b.dataset.type];
    st.type = b.dataset.type;
    form.querySelectorAll('[data-type]').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.getElementById(p + '-unit').value = ty.unit;
    document.getElementById(p + '-per').value = ty.per;
    form.querySelector('.calc span').firstChild.textContent = ty.hint + ' = 예상 소요 ';
    calc(p); return;
  }
  const act = b.dataset.act, id = Number(b.dataset.id), r = route(), t = r.v === 'guide' ? byId(r.id) : null;
  if (act === 'done') { const x = byId(id); patch(id, { done: true, doneAt: Date.now() }); toast('\'' + x.name + '\' 클리어! 아카이브로 옮겼어요.', null); }
  else if (act === 'undone') { e.preventDefault(); patch(id, { done: false, doneAt: null }); }
  else if (act === 'edit') openSheet(byId(id));
  else if (act === 'del') { const x = byId(id); removeWithUndo(y => y.id === id, '\'' + x.name + '\' 과제를 삭제했어요.'); }
  else if (act === 'clearSamples') { const n = S.tasks.filter(x => x.sample).length; removeWithUndo(x => x.sample, '예시 과제 ' + n + '개를 지웠어요.'); }
  else if (act === 'selAll') { const done = S.tasks.filter(x => x.done); const all = done.every(x => S.sel[x.id]); S.sel = {}; if (!all) done.forEach(x => { S.sel[x.id] = true; }); render(); }
  else if (act === 'delSel') { const n = S.tasks.filter(x => x.done && S.sel[x.id]).length; removeWithUndo(x => x.done && S.sel[x.id], '완료한 과제 ' + n + '개를 삭제했어요.'); }
  else if (act === 'addIssue' && t) addIssue(t);
  else if (act === 'rmIssue' && t) patch(t.id, { issues: t.issues.filter((_, i) => i !== Number(b.dataset.i)) });
  else if (act === 'rmFile' && t) patch(t.id, { files: t.files.filter((_, i) => i !== Number(b.dataset.i)) });
  else if (act === 'guide' && t) makeGuide(t.id);
});
function addIssue(t) {
  const inp = $('#wIssue'), v = inp.value.trim();
  if (!v) return;
  inp.value = '';
  patch(t.id, { issues: (t.issues || []).concat([v]), sample: false });
  inp.focus();
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.sel) { S.sel[el.dataset.sel] = el.checked; render(); return; }
  const r = route();
  if (el.dataset.check !== undefined && r.v === 'guide') {
    const t = byId(r.id), c = S.lastGuide.checklist[Number(el.dataset.check)], ch = Object.assign({}, t.checks || {});
    ch[c] = el.checked; patch(t.id, { checks: ch }); return;
  }
  if (el.id === 'wFile' && r.v === 'guide') { addFiles(r.id, Array.from(el.files || [])); el.value = ''; }
});
document.addEventListener('input', e => {
  const el = e.target;
  const qm = /^q-(name|due|amount|unit|per)$/.exec(el.id || '');
  if (qm) S.qf[qm[1]] = el.value;
  if (/^(q|m)-(amount|per)$/.test(el.id)) calc(el.id[0]);
  if (el.id === 'wContent') { const r = route(); clearTimeout(S.cT); S.cT = setTimeout(() => { patch(r.id, { content: el.value }, true); const t = byId(r.id); renderSources(t); renderGuidePanel(t); }, 400); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'wIssue') { e.preventDefault(); const r = route(); addIssue(byId(r.id)); }
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'quick') submit('q'); else if (e.target.id === 'sheetForm') submit('m');
});
['dragover', 'dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest && e.target.closest('#drop');
  if (!d) return;
  e.preventDefault();
  d.classList.toggle('on', ev === 'dragover');
  if (ev === 'drop') addFiles(route().id, Array.from(e.dataTransfer.files || []));
}));
$('#newBtn').addEventListener('click', () => openSheet(null));
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
$('#undoBtn').addEventListener('click', () => {
  if (!S.undo) return;
  clearTimeout(undoTimer);
  setTasks(S.tasks.concat(S.undo));
  S.undo = null; $('#toast').hidden = true;
});
window.addEventListener('hashchange', () => { S.viewKey = null; render(); window.scrollTo(0, 0); });

load();
if (S.blocked) $('#banner').hidden = false;
render();
tickClock();
setInterval(tickClock, 20000);
setInterval(() => {
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && route().v === 'dashboard') return;
  render();
}, 60000);
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('sample').then(fn => { S.sample = fn || null; render(); }, () => {});
}
}
</script>
